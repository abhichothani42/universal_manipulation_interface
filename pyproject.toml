[project]
name = "umi"
version = "0.1.0"
description = "Universal Manipulation Interface - Diffusion Policy for real robot control"
requires-python = "==3.13.*"
dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.11.0",
    "hydra-core>=1.3.3",
    "omegaconf>=2.3.1",
    "wandb>=0.27.2",
    "tqdm>=4.68.2",
    "dill>=0.4.1",
    "numpy>=2.4.6",
    "einops>=0.8.2",
    "diffusers>=0.38.0",
    "robomimic>=0.3.0",
    "zarr>=2.0,<3.0",
    "numcodecs>=0.12,<0.13",
    "imagecodecs>=2026.6.6",
    "av>=17.1.0",
    "opencv-python>=4.13.0.92",
    "filelock>=3.29.4",
    "threadpoolctl>=3.6.0",
    "numba>=0.65.1",
    "pandas>=3.0.3",
    "pyexiftool>=0.5.6",
    "scipy>=1.17.1",
    "accelerate>=1.14.0",
    "timm>=1.0.27",
]

# PyTorch CUDA 12.8 wheel index — use cu128 builds for CUDA 12.x systems
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch      = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
